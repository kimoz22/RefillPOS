<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8fc">
  <title>ClearSpring · Water refill POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <div id="login-root" aria-live="polite">
    <div class="login-loading" role="status">Loading ClearSpring…</div>
  </div>
  <div class="app-shell" id="app-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <a href="#" class="brand" data-page="dashboard">
        <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5C13 8.2 7 14.3 7 20a9 9 0 0 0 18 0c0-5.7-6-11.8-9-16.5Z" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M11.5 21c.3 2.4 2 4 4.4 4.4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"/></svg></span>
        <span class="brand-copy"><strong>ClearSpring</strong><small>REFILL STATION</small></span>
      </a>
      <div class="nav-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">▦</span>Overview</button>
        <button class="nav-item" data-page="pos"><span class="nav-icon">▣</span>Point of sale <span class="nav-shortcut">F2</span></button>
        <button class="nav-item" data-page="inventory"><span class="nav-icon">▤</span>Inventory <span class="nav-count" id="low-count">3</span></button>
        <button class="nav-item" data-page="bottles"><span class="nav-icon">♧</span>Bottle tracking</button>
        <button class="nav-item" data-page="customers"><span class="nav-icon">♙</span>Customers</button>
        <button class="nav-item" data-page="expenses"><span class="nav-icon">↗</span>Expenses</button>
        <button class="nav-item" data-page="reports"><span class="nav-icon">▥</span>Reports</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">✳</div><strong>Need a hand?</strong><span>Get help with your station setup.</span><button type="button" id="help-btn">Visit help center <span>↗</span></button></div>
        <button class="nav-item settings-link" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
        <div class="profile">
          <div class="avatar" id="profile-initials">AM</div><div class="profile-copy"><strong id="profile-name">Alex Morgan</strong><small id="profile-role">Administrator</small></div><button type="button" aria-label="Sign out" title="Sign out" class="profile-more" id="profile-menu">↪</button>
        </div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
        <div class="breadcrumbs"><span>Workspace</span><span class="crumb-sep">/</span><strong id="page-crumb">Overview</strong></div>
        <div class="top-actions">
          <span class="today-label" id="today-label"></span>
          <button class="icon-button notification-button" aria-label="Notifications" id="alerts-btn">♧<i></i></button>
          <div class="top-avatar" id="top-avatar">AM</div>
        </div>
      </header>
      <div class="page-container" id="page-container"></div>
    </main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-region" aria-live="polite"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
